<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10b981" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Subtle grid lines in background -->
  <line x1="80" y1="360" x2="432" y2="360" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  <line x1="80" y1="280" x2="432" y2="280" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  <line x1="80" y1="200" x2="432" y2="200" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Modern Monogram RK -->
  <!-- Letter R -->
  <path d="M 116 135 L 116 365 M 116 135 L 210 135 C 260 135, 260 230, 210 230 L 116 230 M 180 225 L 260 365" 
        fill="none" stroke="url(#textGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropShadow)" />

  <!-- Letter K -->
  <path d="M 296 135 L 296 365 M 405 145 L 302 250 M 336 220 L 420 365" 
        fill="none" stroke="url(#textGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropShadow)" />

  <!-- Surging Sales Growth Arrow Trendline -->
  <path d="M 96 385 C 190 380, 260 320, 395 130" 
        fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" filter="url(#neonGlow)" />
  <!-- Arrow Pointer -->
  <polygon points="405,105 425,160 370,140" fill="#34d399" filter="url(#neonGlow)" />

  <!-- Sales Badge Pill -->
  <rect x="166" y="405" width="180" height="42" rx="21" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" />
  <text x="256" y="433" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#38bdf8" letter-spacing="4">SALES</text>
</svg>
